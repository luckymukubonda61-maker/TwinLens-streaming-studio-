databases:
  - name: twinlens-db
    plan: basic-256mb
    databaseName: twinlens
    user: twinlens

services:
  - type: web
    name: twinlens-web
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: twinlens-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://twinlens-web.onrender.com
